# SentinelSphere – Infrastructure Configuration
# ═══════════════════════════════════════════════════════════════════
# This project has been fully migrated to Google Firebase.
# AWS services (Lambda, API Gateway, DynamoDB) are no longer used.
#
# Current Architecture:
#   Frontend  → Firebase Hosting (static HTML/CSS/JS)
#   Database  → Firebase Firestore (NoSQL cloud database)
#   Analytics → Firebase Analytics (usage tracking)
#
# Deployment:
#   1. Install Firebase CLI:  npm install -g firebase-tools
#   2. Login:                 firebase login
#   3. Initialize:            firebase init (select Hosting + Firestore)
#   4. Deploy:                firebase deploy
#
# Firestore Collections:
#   - threat_reports  : Stores all scan reports (URL, Email, QR)
#   - graph_nodes     : Stores graph entities (Users, Domains, IPs, Emails)
#   - graph_edges     : Stores relationships between graph nodes
#
# Firebase Project: pbl-4th-sem
# Project ID:      pbl-4th-sem
# Hosting URL:     https://pbl-4th-sem.web.app
# ═══════════════════════════════════════════════════════════════════

# NOTE: The previous AWS SAM template (template.yaml) has been replaced.
# All Lambda functions, API Gateway, and DynamoDB table definitions
# have been removed as part of the Firebase migration.
#
# The Python backend modules (threat_modules/, graph_engine/, risk_engine/)
# are retained as reference implementations. The threat analysis logic
# now runs client-side in JavaScript for the MVP deployment.
